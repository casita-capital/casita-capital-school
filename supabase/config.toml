# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "casita-capital-school"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "school"]
extra_search_path = ["public", "extensions", "school"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "https://school.casitacapital.com"
additional_redirect_urls = ["http://127.0.0.1:3002", "http://localhost:3002"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"
